<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Math Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe8f5 50%, #ffd6f0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #ff1493;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #ff69b4;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        .input-group {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            color: #ff1493;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 3px solid #ffb6d9;
            border-radius: 15px;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #ff1493;
            box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.1);
        }
        
        .results {
            display: none;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-item {
            background: linear-gradient(135deg, #fff0f7 0%, #ffe8f5 100%);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            border-left: 5px solid #ff69b4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }
        
        .result-item:hover {
            transform: translateX(5px);
        }
        
        .result-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .result-text {
            flex: 1;
        }
        
        .result-label {
            color: #ff1493;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .result-value {
            color: #ff69b4;
            font-size: 1.5em;
            font-weight: 700;
        }
        
        .result-subtext {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .fun-fact {
            background: linear-gradient(135deg, #ffeb3b22 0%, #ffc10722 100%);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border-left: 5px solid #ffc107;
            text-align: center;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Girl Math Calculator 💅</h1>
        <p class="subtitle">"If I break it down, it's basically free!"</p>
        
        <div class="input-group">
            <label for="price">How much does it cost? (VND)</label>
            <input type="number" id="price" placeholder="3000000" min="0">
        </div>
        
        <div class="results" id="results">
            <div class="result-item">
                <span class="result-icon">🧋</span>
                <div class="result-text">
                    <div class="result-label">Milk Tea Cups</div>
                    <div class="result-value" id="milktea">-</div>
                    <div class="result-subtext">@ 50,000 VND each</div>
                </div>
            </div>
            
            <div class="result-item">
                <span class="result-icon">✈️</span>
                <div class="result-text">
                    <div class="result-label">Domestic Plane Tickets</div>
                    <div class="result-value" id="plane">-</div>
                    <div class="result-subtext">@ 1,500,000 VND each</div>
                </div>
            </div>
            
            <div class="result-item">
                <span class="result-icon">💅</span>
                <div class="result-text">
                    <div class="result-label">Nail Appointments</div>
                    <div class="result-value" id="nails">-</div>
                    <div class="result-subtext">@ 300,000 VND each</div>
                </div>
            </div>
            
            <div class="result-item">
                <span class="result-icon">☕</span>
                <div class="result-text">
                    <div class="result-label">Coffee Dates</div>
                    <div class="result-value" id="coffee">-</div>
                    <div class="result-subtext">@ 80,000 VND each</div>
                </div>
            </div>
            
            <div class="result-item">
                <span class="result-icon">🍜</span>
                <div class="result-text">
                    <div class="result-label">Phở Bowls</div>
                    <div class="result-value" id="pho">-</div>
                    <div class="result-subtext">@ 60,000 VND each</div>
                </div>
            </div>
            
            <div class="result-item">
                <span class="result-icon">🎬</span>
                <div class="result-text">
                    <div class="result-label">Movie Tickets</div>
                    <div class="result-value" id="movie">-</div>
                    <div class="result-subtext">@ 120,000 VND each</div>
                </div>
            </div>
            
            <div class="fun-fact" id="funFact"></div>
        </div>
    </div>
    
    <script>
        const priceInput = document.getElementById('price');
        const results = document.getElementById('results');
        
        const items = {
            milktea: { price: 50000, element: document.getElementById('milktea') },
            plane: { price: 1500000, element: document.getElementById('plane') },
            nails: { price: 300000, element: document.getElementById('nails') },
            coffee: { price: 80000, element: document.getElementById('coffee') },
            pho: { price: 60000, element: document.getElementById('pho') },
            movie: { price: 120000, element: document.getElementById('movie') }
        };
        
        const funFacts = [
            "💖 So really, it's an investment in happiness!",
            "✨ If you think about it per day, it's practically nothing!",
            "🎀 But if I use it every day, the cost per use is SO low!",
            "💕 I saved money by not buying the more expensive one!",
            "🌟 It was on my wishlist, so it doesn't count as shopping!",
            "💝 I'll use it forever, so it's basically free!",
            "🦄 If I return something else, this is technically free!",
            "🎉 Cash doesn't count, only card payments are real money!"
        ];
        
        priceInput.addEventListener('input', function() {
            const price = parseFloat(this.value);
            
            if (price > 0) {
                results.style.display = 'block';
                
                for (let key in items) {
                    const quantity = Math.floor(price / items[key].price);
                    items[key].element.textContent = quantity.toLocaleString();
                }
                
                const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
                document.getElementById('funFact').textContent = randomFact;
            } else {
                results.style.display = 'none';
            }
        });
        
        // Auto-fill example
        if (!priceInput.value) {
            priceInput.value = '3000000';
            priceInput.dispatchEvent(new Event('input'));
        }
    </script>
</body>
</html>
